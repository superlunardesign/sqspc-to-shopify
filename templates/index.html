<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squarespace → Shopify Migrator</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e6ed;
      --muted: #8b8fa3;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --success: #34d399;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    .checkbox-group {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      display: none;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    #status.info {
      display: block;
      background: rgba(108, 99, 255, 0.1);
      border: 1px solid rgba(108, 99, 255, 0.3);
    }

    #status.success {
      display: block;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    #status.error {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--error);
    }

    .download-links {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .download-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .download-links a:hover { background: var(--accent-hover); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .help {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Squarespace &rarr; Shopify</h1>
    <p class="subtitle">Scrape products &amp; reviews, export Shopify-ready CSVs</p>

    <div class="card">
      <form id="scrapeForm">
        <label for="siteUrl">Squarespace Site URL</label>
        <input
          type="text"
          id="siteUrl"
          name="site_url"
          placeholder="https://www.example.com"
          required
        >

        <label for="shopPath">Shop Page Path</label>
        <input
          type="text"
          id="shopPath"
          name="shop_path"
          placeholder="/shop"
          value="/shop"
        >
        <p class="help">The collection page path (e.g. /shop, /products, /store)</p>

        <div class="checkbox-group">
          <label>
            <input type="checkbox" name="scrape_reviews" checked>
            Scrape reviews
          </label>
          <label>
            <input type="checkbox" name="scrape_products" checked>
            Scrape products
          </label>
        </div>

        <button type="submit" id="submitBtn">Start Scraping</button>
      </form>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('scrapeForm');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const siteUrl = document.getElementById('siteUrl').value.trim();
      const shopPath = document.getElementById('shopPath').value.trim() || '/shop';
      const scrapeReviews = form.querySelector('[name="scrape_reviews"]').checked;
      const scrapeProducts = form.querySelector('[name="scrape_products"]').checked;

      if (!siteUrl) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Scraping&hellip;';
      status.className = 'info';
      status.innerHTML = 'Connecting to Squarespace site and scraping products&hellip; This may take a few minutes for large stores.';

      try {
        const resp = await fetch('/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            site_url: siteUrl,
            shop_path: shopPath,
            scrape_reviews: scrapeReviews,
            scrape_products: scrapeProducts,
          }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Scraping failed');
        }

        let html = `Scraped <strong>${data.product_count}</strong> products`;
        if (data.review_count !== undefined) {
          html += ` and <strong>${data.review_count}</strong> reviews`;
        }
        html += '.<div class="download-links">';

        if (data.products_csv) {
          html += `<a href="/download/${data.products_csv}">&#11015; Products CSV</a>`;
        }
        if (data.reviews_csv) {
          html += `<a href="/download/${data.reviews_csv}">&#11015; Reviews CSV</a>`;
        }

        html += '</div>';
        status.className = 'success';
        status.innerHTML = html;
      } catch (err) {
        status.className = 'error';
        status.innerHTML = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Start Scraping';
      }
    });
  </script>
</body>
</html>
